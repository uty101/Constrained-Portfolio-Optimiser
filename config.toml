# config.toml — every parameter of the project. Values fixed by instructions/00_kickoff.md.
# No numeric parameter is hard-coded in pc/. Do not change a value set in the kickoff document.

[run]
seed_master = 20260930
bootstrap_seed = 20260930
cov_eval_seed = 20260931
sensitivity_seed = 20260932

[universe]
tickers = [
    "SPY", "IWM",
    "EFA", "EEM",
    "XLE", "XLF", "XLK", "XLU", "XLV",
    "SHY", "IEF", "TLT",
    "TIP",
    "LQD", "HYG",
    "GLD", "DBC", "VNQ",
]

[universe.asset_class]
SPY = "US equity"
IWM = "US equity"
EFA = "International equity"
EEM = "International equity"
XLE = "US sectors"
XLF = "US sectors"
XLK = "US sectors"
XLU = "US sectors"
XLV = "US sectors"
SHY = "Treasuries"
IEF = "Treasuries"
TLT = "Treasuries"
TIP = "Inflation linked"
LQD = "Credit"
HYG = "Credit"
GLD = "Real assets"
DBC = "Real assets"
VNQ = "Real assets"

[sample]
price_start = "2007-04-11"
price_end = "2026-09-15"
first_decision = "2010-04-30"
last_decision = "2026-07-31"
window_months = 36
days_per_month = 21
expected_n_decisions = 196

[data]
prices_csv = "data/raw/prices_adjclose.csv"
rf_csv = "data/raw/rf_dgs3mo.csv"
manifest = "data/raw/MANIFEST.json"
max_abs_daily_return_flag = 0.25
max_gap_days_flag = 4

[cov]
estimators = ["sample", "lw_cc", "ewma", "pca3"]
ewma_lambda = 0.97
pca_k = 3
max_cond = 1e6

[mv]
gamma = 2.5
upper = 0.30
lower = 0.0
max_turnover = 0.30

[costs]
cost_scales = [0.0, 1.0, 3.0]

[costs.one_way_bp]
SPY = 3
IWM = 3
EFA = 3
EEM = 6
XLE = 3
XLF = 3
XLK = 3
XLU = 3
XLV = 3
SHY = 3
IEF = 3
TLT = 3
TIP = 6
LQD = 3
HYG = 6
GLD = 3
DBC = 6
VNQ = 6

[bl]
delta = 2.5
tau = 0.0277777777777778
mom_lookback = 12
mom_skip = 1
n_long_short = 6
equity_basket = ["SPY", "IWM", "EFA", "EEM"]
bond_basket = ["SHY", "IEF", "TLT"]

[bl.w_mkt]
SPY = 0.19
IWM = 0.04
EFA = 0.12
EEM = 0.05
XLE = 0.02
XLF = 0.02
XLK = 0.02
XLU = 0.02
XLV = 0.02
SHY = 0.05
IEF = 0.09
TLT = 0.08
TIP = 0.04
LQD = 0.08
HYG = 0.04
GLD = 0.04
DBC = 0.03
VNQ = 0.05

[solver]
primary = "CLARABEL"
fallback = "SCS"
scs_eps = 1e-9
clarabel_tol = 1e-12
rp_ftol = 1e-15
rp_gtol = 1e-12
rp_maxiter = 10000

[cov_eval]
n_random = 100

[bootstrap]
mean_block = 6
reps = 10000
ci = [0.05, 0.95]

[sensitivity]
dates = ["2012-12-31", "2020-02-28", "2026-07-31"]
draws = 1000

[turnover_grid]
taus = [0.05, 0.10, 0.20, 0.30, 0.50, 0.75, 1.00]
include_none = true

[positions]
threshold = 0.005

[levered]
strategies = ["risk_parity|lw_cc|none|none", "min_variance|lw_cc|none|B", "hrp|lw_cc|none|none"]
financing_spread_bp_pa = 50

[cli]
default_lot_size = 1
default_min_notional = 1000.0
price_warn_pct = 0.05

[outputs]
results_dir = "outputs/results"
tables_dir = "outputs/tables"
figures_dir = "outputs/figures"
