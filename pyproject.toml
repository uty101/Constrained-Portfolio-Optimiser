[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc"
version = "0.0.0"
description = "Constrained portfolio optimiser and trade generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "cvxpy",
    "clarabel",
    "matplotlib",
    "pyarrow",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-socket",
    "PyPortfolioOpt",
    "scikit-learn",
]

[project.scripts]
pctrade = "pc.cli:main"

[tool.setuptools]
packages = ["pc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
